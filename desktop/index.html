<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoEscape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #080707;
      --foreground: #f8fafc;
      --accent: #ef4444;
      --accent-soft: rgba(239, 68, 68, 0.16);
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 18% -10%, rgba(239, 68, 68, 0.18), transparent 34rem),
        radial-gradient(circle at 86% 6%, rgba(251, 191, 36, 0.08), transparent 28rem),
        radial-gradient(circle at 72% 105%, rgba(127, 29, 29, 0.26), transparent 30rem),
        var(--background);
      color: var(--foreground);
      user-select: none;
      overflow-x: hidden;
      font-feature-settings: "cv02" on, "cv03" on, "cv04" on;
    }

    * {
      box-sizing: border-box;
    }

    /* Subtle interface texture */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 28px 28px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.24;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(248, 113, 113, 0.34);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(248, 113, 113, 0.72);
    }

    .neon-glow {
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.22), inset 0 0 16px rgba(239, 68, 68, 0.08);
    }

    .text-glow {
      text-shadow: 0 0 14px rgba(248, 113, 113, 0.42);
    }

    .brand-title {
      letter-spacing: 0;
      text-wrap: balance;
    }

    .brand-mark {
      animation: brand-breathe 3.8s ease-in-out infinite;
    }

    .brand-orbit::before,
    .brand-orbit::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      border: 1px solid rgba(248, 113, 113, 0.22);
    }

    .brand-orbit::before {
      animation: orbit-scan 8s linear infinite;
      border-top-color: rgba(248, 113, 113, 0.8);
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-left-color: transparent;
    }

    .brand-orbit::after {
      animation: orbit-scan 11s linear infinite reverse;
      inset: 18px;
      border-bottom-color: rgba(251, 191, 36, 0.5);
      border-left-color: transparent;
      border-top-color: transparent;
      border-right-color: transparent;
    }

    .metric-tile {
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .metric-tile:hover {
      transform: translateY(-2px);
      border-color: rgba(248, 113, 113, 0.38);
      background: rgba(127, 29, 29, 0.2);
    }

    .reveal-up {
      animation: reveal-up 520ms ease-out both;
    }

    .reveal-up-delayed {
      animation: reveal-up 560ms ease-out 90ms both;
    }

    .noescape-shell::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 0%, rgba(248, 113, 113, 0.05) 46%, transparent 54%);
      background-size: 220% 100%;
      animation: redline-sweep 12s ease-in-out infinite;
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.18);
      }

      50% {
        box-shadow: 0 0 30px rgba(248, 113, 113, 0.34);
      }
    }

    @keyframes brand-breathe {

      0%,
      100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 30px rgba(239, 68, 68, 0.18);
      }

      50% {
        transform: translateY(-1px) scale(1.025);
        box-shadow: 0 0 44px rgba(248, 113, 113, 0.28);
      }
    }

    @keyframes orbit-scan {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes reveal-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes redline-sweep {

      0%,
      72%,
      100% {
        background-position: 160% 0;
      }

      42% {
        background-position: -80% 0;
      }
    }

    .animate-pulse-glow {
      animation: pulse-glow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/renderer/main.tsx"></script>
</body>

</html>
