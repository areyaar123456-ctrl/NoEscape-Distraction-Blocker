<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Agent - Distraction Blocked</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600&family=Outfit:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #5D7A65;
            /* Deep Sage Green matching the user image */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #E2E8DE;
            /* Light Sage Text */
            font-family: 'Outfit', sans-serif;
            transition: background 1s ease-in-out;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon {
            width: 160px;
            height: 160px;
            margin-bottom: 2rem;
            opacity: 0.9;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -0.02em;
            line-height: 1.1;
            font-weight: 600;
        }

        p {
            font-family: 'Crimson Pro', serif;
            font-size: 2.2rem;
            margin: 0.5rem 0 2rem;
            opacity: 0.9;
        }

        .countdown-container {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .timer-track {
            width: 120px;
            height: 3px;
            background: rgba(226, 232, 222, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: #E2E8DE;
            border-radius: 10px;
            animation: deplete 10s linear forwards;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 1.5rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            opacity: 0.7;
        }

        .link {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .link:hover {
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes deplete {
            from {
                width: 100%;
            }

            to {
                width: 0%;
            }
        }

        /* Ambient glowing background effect */
        .ambient {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(226, 232, 222, 0.05) 0%, rgba(226, 232, 222, 0) 70%);
            z-index: -1;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(0.8);
            }

            50% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1.1);
            }

            100% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }
    </style>
</head>

<body>
    <div class="ambient"></div>
    <div class="container">
        <!-- SVG Butterfly Logo (mimicking the aesthetic) -->
        <svg class="icon" viewBox="0 0 100 100" fill="currentColor">
            <path
                d="M50 85c-2-10-8-15-15-18-10-5-25-2-30-15s15-30 25-25c5 2 10 8 15 15z m0 0c2-10 8-15 15-18 10-5 25-2 30-15s-15-30-25-25c-5 2-10 8-15 15z" />
            <path
                d="M50 85c-1-8-4-12-8-14-6-3-15-1.5-18-9.5s9-17 15-14c3 1.5 6 5 8 9.5z m0 0c1-8 4-12 8-14 6-3 15-1.5 18-9.5s-9-17-15-14c-3 1.5-6 5-8 9.5z"
                opacity="0.6" />
        </svg>

        <h1 id="quote-main">You are free.</h1>
        <p id="quote-sub">Do what matters.</p>

        <div class="countdown-container">
            <div class="timer-track">
                <div class="timer-bar"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span class="link">SECURE PROTECTION ACTIVE</span>
        <span class="link">GIVE FREEDOM</span>
    </div>

            ["Life shrinks or expands", "In proportion to one's courage."],
            ["If you hear a voice within you say 'you cannot paint,'", "Then by all means paint and that voice will be silenced."],

            ["Ask and it will be given to you;", "Seek and you will find; knock and the door will be opened to you."],
            ["The only person you are destined to become", "Is the person you decide to be."],
            ["Go confidently in the direction of your dreams.", "Live the life you have imagined."],
            ["When I stand before God at the end of my life,", "I would hope that I would not have a single bit of talent left."],
            ["Few things can help an individual more", "Than to place responsibility on him, and to let him know that you trust him."],
            ["Certain things catch your eye,", "But pursue only those that capture the heart."],
            ["Believe you can", "And you're halfway there."],
            ["Everything you've ever wanted", "Is on the other side of fear."],
            ["We can easily forgive a child who is afraid of the dark;", "The real tragedy of life is when men are afraid of the light."]
        ];

        // Pick a random quote
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-main').textContent = randomQuote[0];
        document.getElementById('quote-sub').textContent = randomQuote[1];

        // Close via Electron IPC after 10 seconds
        if (window.require) {
            const { ipcRenderer } = require('electron');
            setTimeout(() => {
                ipcRenderer.send('hide-splash');
            }, 10000);
        }
    </script>
</body>

</html>
